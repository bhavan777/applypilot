name: Build and publish Chrome extension

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/manifest.json"
      - "index.html"
      - "popup.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'publish installable Chrome extension') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Build extension
        run: npm run build
      - name: Package installable extension
        run: |
          test -f dist/manifest.json
          test -f dist/content.js
          mkdir -p release
          rm -f release/applypilot-chrome-extension.zip
          cd dist
          zip -qr ../release/applypilot-chrome-extension.zip .
          cd ..
      - name: Commit build output and ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git add -f dist
          git add release/applypilot-chrome-extension.zip
          if git diff --cached --quiet; then
            echo "Build output is already up to date."
            exit 0
          fi
          git commit -m "build: publish installable Chrome extension"
          git push origin HEAD:main
